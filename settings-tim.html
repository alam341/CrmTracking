</div>

<script src="js/upload-common.js"></script><script>
// ── FU Template defaults ──────────────────────────────────────────────────────
const FU_DEFAULTS = {
  info: `⚠️ *[Info] Paket Bermasalah*\n\nHalo [nama_cs]!\n\nAda paket yang perlu ditindaklanjuti:\n\n👤 Customer: [nama_customer] ([hp_customer])\n📦 Produk: [produk]\n🔢 Resi: *[resi]*\n🚚 Ekspedisi: [ekspedisi]\n📍 Kota: [kota]\n❌ Kasus: [kasus]\n\nMohon segera follow up ke kurir ya! 🙏`,
  fu1:  `📨 *[FU 1] Paket Bermasalah*\n\nHalo [nama_cs], mengingatkan:\n\n👤 Customer: [nama_customer] ([hp_customer])\n📦 Produk: [produk]\n🔢 Resi: *[resi]*\n🚚 Ekspedisi: [ekspedisi]\n📍 Kota: [kota]\n❌ Kasus: [kasus]\n\nBelum ada update — mohon segera dikonfirmasi! 🙏`,
  fu2:  `🔔 *[FU 2] Pengingat Paket Bermasalah*\n\nHalo [nama_cs], mengingatkan kembali:\n\n👤 Customer: [nama_customer] ([hp_customer])\n📦 Produk: [produk]\n🔢 Resi: *[resi]*\n🚚 Ekspedisi: [ekspedisi]\n📍 Kota: [kota]\n❌ Kasus: [kasus]\n\nSudah 2 hari belum ada konfirmasi — tolong segera ditindak! 🙏`,
  fu3:  `🚨 *[FU 3 - Terakhir] Paket Bermasalah*\n\nHalo [nama_cs], ini follow up terakhir:\n\n👤 Customer: [nama_customer] ([hp_customer])\n📦 Produk: [produk]\n🔢 Resi: *[resi]*\n🚚 Ekspedisi: [ekspedisi]\n📍 Kota: [kota]\n❌ Kasus: [kasus]\n\nHarap konfirmasi hari ini ya! 🙏`,
};

const FU_SB_KEY = { info:'fu_template_info', fu1:'fu_template_fu1', fu2:'fu_template_fu2', fu3:'fu_template_fu3' };
const FU_LABELS  = { info:'FU Info', fu1:'FU 1', fu2:'FU 2', fu3:'FU 3' };

function fuSetViewMode(key, text) {
  document.getElementById('fu-tpl-' + key).style.display     = 'none';
  document.getElementById('fu-preview-' + key).style.display = 'block';
  document.getElementById('fu-preview-' + key).textContent   = text;
  document.getElementById('fu-btns-' + key).innerHTML = `
    <button onclick="fuEdit('${key}')"
      style="border:1px solid var(--primary);background:var(--input-bg);color:var(--primary);border-radius:6px;padding:3px 12px;font-size:.72rem;font-weight:600;cursor:pointer">
      ✏️ Edit
    </button>`;
}

function fuEdit(key) {
  const preview = document.getElementById('fu-preview-' + key);
  const ta = document.getElementById('fu-tpl-' + key);
  ta.value = preview.textContent;
  ta.style.display = 'block';
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  preview.style.display = 'none';
  document.getElementById('fu-btns-' + key).innerHTML = `
    <button id="fu-save-${key}" onclick="fuSave('${key}')"
      style="border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;padding:3px 12px;font-size:.72rem;font-weight:600;cursor:pointer">
      Simpan
    </button>
    <button onclick="fuReset('${key}')"
      style="border:1px solid var(--border);background:var(--input-bg);color:var(--text-3);border-radius:6px;padding:3px 10px;font-size:.72rem;cursor:pointer">
      Reset
    </button>`;
}

async function fuLoadTemplates() {
  try {
    const { data } = await _sb.from('settings')
      .select('key,value')
      .in('key', Object.values(FU_SB_KEY));
    const map = {};
    (data || []).forEach(r => { map[r.key] = r.value; });
    for (const [k, sbKey] of Object.entries(FU_SB_KEY)) {
      const val = map[sbKey] || FU_DEFAULTS[k];
      const ta = document.getElementById('fu-tpl-' + k);
      if (!ta) continue;
      if (map[sbKey]) {
        // Sudah pernah disimpan → tampil view mode
        fuSetViewMode(k, val);
      } else {
        // Belum ada di DB → tampil edit mode
        ta.value = val;
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
      }
    }
  } catch {
    for (const [k] of Object.entries(FU_SB_KEY)) {
      const ta = document.getElementById('fu-tpl-' + k);
      if (!ta) continue;
      ta.value = FU_DEFAULTS[k];
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }
  }
}

async function fuSave(key) {
  const el = document.getElementById('fu-tpl-' + key);
  if (!el) return;
  const btn = document.getElementById('fu-save-' + key);
  if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }
  try {
    const { error } = await _sb.from('settings')
      .upsert({ key: FU_SB_KEY[key], value: el.value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) throw error;
    showToast(`Template ${FU_LABELS[key]} berhasil disimpan`, 'success');
    fuSetViewMode(key, el.value);
  } catch(e) {
    showToast(`Gagal simpan: ${e.message}`, 'error');
    if (btn) { btn.textContent = 'Simpan'; btn.disabled = false; }
  }
}

async function fuReset(key) {
  if (!confirm('Reset template ini ke default?')) return;
  const ta = document.getElementById('fu-tpl-' + key);
  if (!ta) return;
  ta.value = FU_DEFAULTS[key];
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  await fuSave(key);
}

let _timMembers = [];
let timPage = 1;
const TIM_PAGE_SIZE = 10;

(async () => {
  await initSupabaseClient();
  const user = await requireAuth();
  if (!user) return;
  renderLayout('settings-tim', user);
  renderTeamPage();
  fuLoadTemplates();
})();

function renderTeamPage() {
  document.getElementById('pageContent').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-header-left">
          <h3>💬 Template Follow Up</h3>
          <div class="card-sub">Pesan yang dikirim otomatis ke CS saat paket bermasalah. Variabel yang bisa dipakai: <code>[nama_cs]</code> <code>[nama_customer]</code> <code>[hp_customer]</code> <code>[produk]</code> <code>[resi]</code> <code>[ekspedisi]</code> <code>[kota]</code> <code>[kasus]</code></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 0 12px">
        ${[
          { key:'info', label:'FU Info', emoji:'⚠️', color:'var(--warning)', bg:'rgba(255,183,3,.08)' },
          { key:'fu1',  label:'FU 1',   emoji:'📨', color:'#c06000',         bg:'rgba(239,140,0,.08)' },
          { key:'fu2',  label:'FU 2',   emoji:'🔔', color:'#b36000',         bg:'rgba(239,120,0,.08)' },
          { key:'fu3',  label:'FU 3 (Terakhir)', emoji:'🚨', color:'var(--danger)', bg:'rgba(239,35,60,.06)' },
        ].map(t => `
          <div style="border:1px solid var(--border);border-radius:12px;padding:14px;background:${t.bg}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <span style="font-weight:700;font-size:.85rem;color:${t.color}">${t.emoji} ${t.label}</span>
              <div id="fu-btns-${t.key}" style="display:flex;gap:6px">
                <button id="fu-save-${t.key}" onclick="fuSave('${t.key}')"
                  style="border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;padding:3px 12px;font-size:.72rem;font-weight:600;cursor:pointer">
                  Simpan
                </button>
                <button onclick="fuReset('${t.key}')"
                  style="border:1px solid var(--border);background:var(--input-bg);color:var(--text-3);border-radius:6px;padding:3px 10px;font-size:.72rem;cursor:pointer">
                  Reset
                </button>
              </div>
            </div>
            <textarea id="fu-tpl-${t.key}" rows="6"
              oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
              style="width:100%;box-sizing:border-box;resize:none;overflow:hidden;font-size:.78rem;line-height:1.6;color:var(--text-1);background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit"></textarea>
            <div id="fu-preview-${t.key}" style="display:none;font-size:.78rem;line-height:1.6;color:var(--text-2);background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word"></div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-header-left">
          <h3>📱 WA Notifikasi Internal</h3>
          <div class="card-sub">Nomor WA yang dipakai kirim notif ke CS kalau ada order bermasalah</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="loadNotifStatus()">🔄 Cek Status</button>
      </div>
      <div id="notifStatusWrap" style="padding:4px 0 8px">
        <div style="color:var(--text-3);font-size:.85rem">Memuat status...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h3>👥 Kelola Tim CS</h3>
          <div class="card-sub">Nama CS harus sama persis dengan kolom cs_nama di data upload — dipakai untuk rute notif WA kalau ada paket bermasalah</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openMemberModal()">+ Tambah CS</button>
      </div>
      <div id="timList"></div>
    </div>
  `;
  loadTeamMembers();
  loadNotifStatus();
}

let _notifStatusTimer = null;
async function loadNotifStatus() {
  const wrap = document.getElementById('notifStatusWrap');
  if (!wrap) return;
  try {
    const r = await fetch('/api/notif-proxy?action=qr');
    const data = await r.json();

    if (data.error) {
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#EF233C;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:.85rem;color:var(--danger)">Service tidak bisa dihubungi — pastikan VPS & baileys-notif aktif</span>
      </div>`;
      return;
    }

    if (data.connected) {
      clearInterval(_notifStatusTimer);
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#06C270;display:inline-block;flex-shrink:0;box-shadow:0 0 0 3px rgba(6,194,112,.2)"></span>
        <span style="font-size:.85rem;color:var(--success);font-weight:600">Terhubung — siap kirim notif WA ke CS</span>
      </div>`;
      return;
    }

    if (data.waiting) {
      wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <span style="width:10px;height:10px;border-radius:50%;background:#FFB703;display:inline-block;flex-shrink:0"></span>
        <span style="font-size:.85rem;color:var(--text-2)">Menunggu QR... (restart baileys-notif di VPS)</span>
      </div>`;
      return;
    }

    if (data.qr) {
      clearInterval(_notifStatusTimer);
      wrap.innerHTML = `
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
          <div>
            <img src="${escapeHtml(data.qr)}" style="width:200px;height:200px;border:3px solid var(--border);border-radius:10px;display:block">
            <div style="font-size:.72rem;color:var(--text-3);margin-top:6px;text-align:center">QR expired tiap ~60 detik</div>
          </div>
          <div style="max-width:280px">
            <div style="font-weight:600;font-size:.88rem;margin-bottom:8px">📱 Cara scan:</div>
            <ol style="font-size:.82rem;color:var(--text-2);line-height:1.8;padding-left:18px;margin:0">
              <li>Buka WhatsApp di HP</li>
              <li>Setelan → Perangkat Tertaut</li>
              <li>Tautkan Perangkat</li>
              <li>Scan QR di kiri</li>
            </ol>
            <div style="margin-top:12px;font-size:.78rem;color:var(--text-3)">Gunakan nomor khusus notifikasi internal — bukan nomor CS aktif.</div>
            <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="loadNotifStatus()">🔄 Refresh QR</button>
          </div>
        </div>
      `;
      // Auto-refresh QR tiap 30 detik kalau belum terscan
      _notifStatusTimer = setInterval(loadNotifStatus, 30000);
    }
  } catch(e) {
    wrap.innerHTML = `<div style="font-size:.82rem;color:var(--text-3)">Gagal cek status: ${escapeHtml(e.message)}</div>`;
  }
}

// ── Team Members CRUD ─────────────────────────────────────────────────────────
async function loadTeamMembers() {
  const el = document.getElementById('timList');
  el.innerHTML = `<div class="page-loading"><div class="spinner"></div></div>`;
  try {
    const { data, error } = await _sb.from('team_members').select('*').order('nama', { ascending: true });
    if (error) throw error;
    _timMembers = data || [];
    timPage = 1;
    renderTimList();
  } catch (e) {
    el.innerHTML = `<div style="color:var(--danger);padding:20px">Gagal memuat: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTimList() {
  const el = document.getElementById('timList');
  if (!_timMembers.length) {
    el.innerHTML = `<div class="empty" style="padding:32px;text-align:center;color:var(--text-3)">
      <div style="font-size:2rem;margin-bottom:8px">👥</div>
      <div>Belum ada CS terdaftar. Klik "+ Tambah CS" untuk menambah.</div>
    </div>`;
    return;
  }
  const totalPages = Math.ceil(_timMembers.length / TIM_PAGE_SIZE);
  timPage = Math.min(Math.max(timPage, 1), totalPages);
  const start = (timPage - 1) * TIM_PAGE_SIZE;
  const pageItems = _timMembers.slice(start, start + TIM_PAGE_SIZE);

  const rows = pageItems.map(m => `
    <tr>
      <td style="font-weight:600">${escapeHtml(m.nama || '')}</td>
      <td style="font-size:.82rem">${escapeHtml(m.no_wa || '-')}</td>
      <td>
        <span style="font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600;
          background:${m.role === 'spv' ? 'rgba(67,97,238,.12)' : 'rgba(6,194,112,.12)'};
          color:${m.role === 'spv' ? 'var(--primary)' : 'var(--success)'}">
          ${escapeHtml(m.role || 'cs')}
        </span>
      </td>
      <td>
        <span style="font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600;
          background:${m.aktif ? 'rgba(6,194,112,.12)' : 'rgba(239,35,60,.1)'};
          color:${m.aktif ? 'var(--success)' : 'var(--danger)'}">
          ${m.aktif ? 'Aktif' : 'Nonaktif'}
        </span>
      </td>
      <td style="text-align:right">
        <button onclick="openMemberModal(${m.id})" class="btn btn-outline btn-sm" style="margin-right:4px">✏️ Edit</button>
        <button onclick="deleteMember(${m.id}, '${escapeHtml(m.nama || '')}')" class="btn btn-sm" style="background:#FEE2E2;color:#EF233C;border:none;cursor:pointer;border-radius:8px;padding:5px 10px;font-size:.78rem;font-weight:700">Hapus</button>
      </td>
    </tr>
  `).join('');

  const pagination = totalPages > 1 ? `
    <div style="display:flex;align-items:center;gap:10px;justify-content:center;padding:16px 0 4px">
      <button class="btn btn-outline btn-sm" onclick="timGoPage(${timPage - 1})" ${timPage <= 1 ? 'disabled' : ''}>← Prev</button>
      <span style="font-size:.82rem;color:var(--text-2)">Hal <strong>${timPage}</strong>/${totalPages} · ${_timMembers.length} CS</span>
      <button class="btn btn-outline btn-sm" onclick="timGoPage(${timPage + 1})" ${timPage >= totalPages ? 'disabled' : ''}>Next →</button>
    </div>
  ` : `<div style="font-size:.78rem;color:var(--text-3);padding:10px 0 4px">${_timMembers.length} CS terdaftar</div>`;

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nama CS</th><th>No WhatsApp</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pagination}
  `;
}

function timGoPage(page) {
  timPage = page;
  renderTimList();
}

// ── Modal Tambah/Edit Member ──────────────────────────────────────────────────
function openMemberModal(id = null) {
  const member = id ? _timMembers.find(m => m.id === id) : null;
  const isEdit = !!member;

  let overlay = document.getElementById('memberModalOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'memberModalOverlay';
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal" style="max-width:420px">
      <div class="modal-header">
        <h3 id="memberModalTitle">Tambah CS</h3>
        <button class="modal-close" onclick="closeMemberModal()">✕</button>
      </div>
      <div class="modal-body" id="memberModalBody"></div>
    </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) closeMemberModal(); });
    document.body.appendChild(overlay);
  }

  document.getElementById('memberModalTitle').textContent = isEdit ? 'Edit CS' : 'Tambah CS';
  document.getElementById('memberModalBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label style="font-size:.82rem;font-weight:700;color:var(--text-2);display:block;margin-bottom:6px">Nama CS *</label>
        <input id="mbNama" class="ctrl-input" style="width:100%" placeholder="Contoh: Siti Aminah"
          value="${escapeHtml(member?.nama || '')}">
        <div style="font-size:.72rem;color:var(--text-3);margin-top:4px">Harus sama persis dengan cs_nama di data upload</div>
      </div>
      <div>
        <label style="font-size:.82rem;font-weight:700;color:var(--text-2);display:block;margin-bottom:6px">No WhatsApp</label>
        <input id="mbWa" class="ctrl-input" style="width:100%" placeholder="628123456789 (format internasional)"
          value="${escapeHtml(member?.no_wa || '')}">
      </div>
      <div>
        <label style="font-size:.82rem;font-weight:700;color:var(--text-2);display:block;margin-bottom:6px">Role</label>
        <select id="mbRole" class="ctrl-select" style="width:100%">
          <option value="cs" ${(member?.role || 'cs') === 'cs' ? 'selected' : ''}>CS</option>
          <option value="spv" ${member?.role === 'spv' ? 'selected' : ''}>Supervisor</option>
        </select>
      </div>
      <div>
        <label style="font-size:.82rem;font-weight:700;color:var(--text-2);display:block;margin-bottom:6px">Status</label>
        <select id="mbAktif" class="ctrl-select" style="width:100%">
          <option value="true" ${(member?.aktif !== false) ? 'selected' : ''}>Aktif</option>
          <option value="false" ${member?.aktif === false ? 'selected' : ''}>Nonaktif</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
        <button class="btn btn-outline btn-sm" onclick="closeMemberModal()">Batal</button>
        <button class="btn btn-primary btn-sm" id="btnSaveMember" onclick="saveMember(${id || 'null'})">
          ${isEdit ? '💾 Simpan' : '+ Tambah'}
        </button>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('mbNama').focus();
}

function closeMemberModal() {
  document.getElementById('memberModalOverlay')?.classList.remove('open');
}

async function saveMember(id) {
  const nama  = document.getElementById('mbNama').value.trim();
  const no_wa = document.getElementById('mbWa').value.trim();
  const role  = document.getElementById('mbRole').value;
  const aktif = document.getElementById('mbAktif').value === 'true';

  if (!nama) { showToast('Nama CS wajib diisi', 'error'); return; }

  const btn = document.getElementById('btnSaveMember');
  if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }

  try {
    if (id) {
      const { error } = await _sb.from('team_members').update({ nama, no_wa, role, aktif }).eq('id', id);
      if (error) throw error;
      showToast('CS berhasil diupdate', 'success');
    } else {
      const { error } = await _sb.from('team_members').insert({ nama, no_wa, role, aktif });
      if (error) throw error;
      showToast('CS berhasil ditambahkan', 'success');
    }
    closeMemberModal();
    await loadTeamMembers();
  } catch (e) {
    showToast('Gagal simpan: ' + e.message, 'error');
    if (btn) { btn.textContent = id ? '💾 Simpan' : '+ Tambah'; btn.disabled = false; }
  }
}

async function deleteMember(id, nama) {
  if (!confirm(`Hapus CS "${nama}"? Data ini tidak bisa dikembalikan.`)) return;
  try {
    const { error } = await _sb.from('team_members').delete().eq('id', id);
    if (error) throw error;
    showToast(`CS "${nama}" berhasil dihapus`, 'success');
    await loadTeamMembers();
  } catch (e) {
    showToast('Gagal hapus: ' + e.message, 'error');
  }
}
</script>
</body>
</html>
